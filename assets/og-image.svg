<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#08090c"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- corner frame -->
  <rect x="44" y="44" width="1112" height="542" rx="18" fill="none" stroke="#22d3ee" stroke-opacity="0.16" stroke-width="2"/>

  <!-- brand mark -->
  <g transform="translate(92,88)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M17 46V18l13 17.5V18" fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 18v28h10" fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- kicker -->
  <text x="92" y="232" font-family="JetBrains Mono" font-size="19" font-weight="500" letter-spacing="4.2" fill="#8b93a3">FREE FIRE MAX · MATCH ARCHIVE</text>

  <!-- rule -->
  <rect x="92" y="262" width="180" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- headline -->
  <text x="92" y="352" font-family="Space Grotesk" font-weight="700" font-size="62" letter-spacing="-1.9" fill="#f2f4f7">Every match.</text>
  <text x="92" y="424" font-family="Space Grotesk" font-weight="700" font-size="62" letter-spacing="-1.9" fill="#f2f4f7">Every entry fee.</text>
  <text x="92" y="496" font-family="Space Grotesk" font-weight="700" font-size="62" letter-spacing="-1.9" fill="#22d3ee">Every prize.</text>

  <!-- mode chips -->
  <g font-family="JetBrains Mono" font-size="17" font-weight="500" letter-spacing="1.4" fill="#ccd2dc">
    <rect x="92" y="530" width="164" height="40" rx="20" fill="none" stroke="#2e3440" stroke-width="1.5"/>
    <text x="174" y="556" text-anchor="middle">Clash Squad</text>
    <rect x="272" y="530" width="184" height="40" rx="20" fill="none" stroke="#2e3440" stroke-width="1.5"/>
    <text x="364" y="556" text-anchor="middle">Battle Royale</text>
    <rect x="472" y="530" width="142" height="40" rx="20" fill="none" stroke="#2e3440" stroke-width="1.5"/>
    <text x="543" y="556" text-anchor="middle">Lone Wolf</text>
  </g>

  <!-- right panel: a scoreline card -->
  <g transform="translate(748,150)">
    <rect x="0" y="0" width="360" height="330" rx="20" fill="#11141a" stroke="#22262f" stroke-width="1.5"/>
    <text x="28" y="48" font-family="JetBrains Mono" font-size="15" letter-spacing="2.6" fill="#8b93a3">CLASH SQUAD · BERMUDA</text>
    <rect x="28" y="68" width="304" height="1.5" fill="#22262f"/>
    <text x="28" y="132" font-family="Space Grotesk" font-weight="700" font-size="40" fill="#f2f4f7">3-1</text>
    <text x="28" y="170" font-family="Space Grotesk" font-weight="500" font-size="24" fill="#ccd2dc">NIGHTFORGE</text>
    <text x="28" y="204" font-family="Space Grotesk" font-weight="500" font-size="24" fill="#8b93a3">TEAM VELOCITY</text>
    <rect x="28" y="232" width="72" height="30" rx="8" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="64" y="252" text-anchor="middle" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#34d399">W</text>
    <text x="116" y="252" font-family="JetBrains Mono" font-size="15" fill="#8b93a3">#1</text>
    <text x="28" y="300" font-family="JetBrains Mono" font-size="17" fill="#ccd2dc">₹10,000</text>
    <text x="332" y="300" text-anchor="end" font-family="JetBrains Mono" font-size="15" fill="#8b93a3">PRIZE</text>
  </g>
</svg>
